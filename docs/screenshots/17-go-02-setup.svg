<text x="34.8" y="111.6" textLength="142.8" lengthAdjust="spacingAndGlyphs" class="b">Set up the server</text>
<text x="849.6" y="111.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="18.0" y="128.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="34.8" y="128.6" textLength="655.2" lengthAdjust="spacingAndGlyphs">Installs Caddy (HTTPS), rsync, curl and nftables from apt, the tando programs,</text>
<text x="849.6" y="128.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="18.0" y="145.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="34.8" y="145.6" textLength="646.8" lengthAdjust="spacingAndGlyphs">a firewall unit and alert checks every minute. Takes 1-2 minutes. RAM: 16 GB.</text>
<text x="849.6" y="145.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="18.0" y="162.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="849.6" y="162.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="18.0" y="179.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="34.8" y="179.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="b" style="fill:#56b6c2">❯</text>
<text x="51.6" y="179.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="b">1</text>
<text x="76.8" y="179.6" textLength="151.2" lengthAdjust="spacingAndGlyphs" class="b">Install everything</text>
<text x="236.4" y="179.6" textLength="109.2" lengthAdjust="spacingAndGlyphs" class="b" style="fill-opacity:.6">(recommended)</text>
<text x="849.6" y="179.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="18.0" y="196.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="85.2" y="196.6" textLength="462.0" lengthAdjust="spacingAndGlyphs" style="fill-opacity:.6">and a swap file if the server has less than 2 GB of RAM</text>
<text x="849.6" y="196.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="18.0" y="213.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="51.6" y="213.6" textLength="8.4" lengthAdjust="spacingAndGlyphs">2</text>
<text x="76.8" y="213.6" textLength="302.4" lengthAdjust="spacingAndGlyphs">Install everything but the swap file</text>
<text x="849.6" y="213.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="18.0" y="230.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="85.2" y="230.6" textLength="252.0" lengthAdjust="spacingAndGlyphs" style="fill-opacity:.6">for servers that must not swap</text>
<text x="849.6" y="230.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="18.0" y="247.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="51.6" y="247.6" textLength="8.4" lengthAdjust="spacingAndGlyphs">3</text>
<text x="76.8" y="247.6" textLength="336.0" lengthAdjust="spacingAndGlyphs">Skip: I will run tando host setup myself</text>
<text x="849.6" y="247.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
<text x="18.0" y="264.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" style="fill:#6c6c6c">│</text>
